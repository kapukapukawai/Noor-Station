<!DOCTYPE html>
<html lang="ja">
<head>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オフライン保存 | AL-くるあーん</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">

<style>
    :root {
        --deep-green: #1d4533;
        --variant-orange: #FF8C00;
    }
    .dl-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: white;
        padding: 15px 20px;
        border-bottom: 1px solid #eee;
        transition: background 0.2s;
    }
    .btn-dl {
        border: 1px solid var(--deep-green);
        background: transparent;
        color: var(--deep-green);
        border-radius: 20px;
        padding: 6px 12px;
        font-size: 0.85rem;
        font-weight: bold;
        transition: all 0.3s;
    }
    .btn-dl.saved {
        background: var(--deep-green);
        color: white;
    }
    .btn-dl:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>
<script src="surainport.js"></script>
</head>
<body>
    <nav class="p-3 bg-white border-bottom sticky-top">
        <a href="../index.html" class="text-decoration-none" style="color: var(--deep-green);">❮ 戻る</a>
        <h5 class="d-inline ms-3 fw-bold">ダウンロード管理</h5>
    </nav>
    <div class="mb-3 p-3 border rounded bg-light">
    <label class="me-2">全体設定:</label>
    <select id="global-qiraat-select" class="form-select d-inline-block w-auto" onchange="updateAllSelectors(this.value)">
        <option value="hafs">ハフス</option>
        <option value="warsh">ワルシュ</option>
        <option value="qulun">カルーン</option>
        <option value="duri">ドゥーリー</option>
        <option value="shuba">シュウバ</option>
        <option value="kisai">キサイ</option> </select>
</div>
   

<div class="px-3 py-2 bg-white small text-muted">
    終了するまで戻らないでください。保存した章はオフラインで読めるようになります。
</div>
    <div class="p-3 bg-white border-bottom d-flex gap-2">
    <button class="btn btn-outline-success btn-sm rounded-pill" onclick="downloadAll()">
        🚀 全て順番に保存
    </button>
    <button class="btn btn-outline-danger btn-sm rounded-pill" onclick="clearAllData()">
        🗑️ 全キャッシュ削除
    </button>
</div>

    <div id="dl-list-container">
        </div>

    <script src="surainport.js"></script>
    <script>
        // 初期表示で全114章のリストを作る
        window.onload = () => {
            
    const container = document.getElementById('dl-list-container');
    
    for(let i=1; i<=114; i++) {
        const card = document.createElement('div');
        card.className = 'dl-card';
        
        // ★LocalStorageにデータがあるかチェック
        const isSaved = localStorage.getItem(`offline_surah_${i}`);
        
        // データがあれば「saved」クラスと「保存済み」テキストを最初からセット
        const btnClass = isSaved ? 'btn-dl saved' : 'btn-dl';
        const btnText = isSaved ? '保存済み' : '保存する';

        card.innerHTML = `
            <div>
                <span class="me-2 opacity-50">${i}</span>
                <strong>Surah ${i}</strong>
            </div>
            <button id="btn-${i}" class="${btnClass}" onclick="handleDownload(${i})">${btnText}</button>
        `;
        container.appendChild(card);
    }
};
    </script>
</body>
</html>
