<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-くるあーん | 聖典選択</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Roboto:wght@300;400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/beercss@3.5.1/dist/cdn/beer.min.css">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.5.1/dist/cdn/beer.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@material/web@latest/all.js"></script>
    
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="AL-くるあーん">

<style>
    /* 🍏 Android 16 (Baklava) 最新公式トーン */
    :root {
        --android-bg: #f9f9fc !important;
        --android-text-main: #1a1c19 !important;
        --android-text-sub: #424944 !important;
        --primary: #2e693f !important;
        --android-selected-bg: #cce8cd !important;
        --android-selected-text: #0b381e !important;
    }

    body { 
        background-color: var(--android-bg) !important;
        font-family: "Roboto", "Noto Sans JP", sans-serif !important;
        margin: 0;
        padding: 0;
        color: var(--android-text-main);
    }

    nav.top {
        background-color: var(--android-bg) !important;
        color: var(--android-text-main) !important;
        box-shadow: none !important;
        border: none !important;
        padding: 24px 16px 12px 16px !important;
        position: relative !important; 
        height: auto !important;
        margin-bottom: 16px !important;
    }
    nav.top h5 {
        font-size: 1.5rem !important;
        font-weight: 500 !important;
        color: var(--primary) !important;
        letter-spacing: 1px !important;
        margin: 0 !important;
    }

    #surah-list-container {
        padding: 0 16px 24px 16px !important;
        display: block !important;
    }

    /* 📱 Android 16 (Baklava) 仕様：より滑らかで大きな角丸、完全フラット・ピルスタイル */
    .android-setting-item {
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        text-decoration: none !important;
        color: inherit !important;
        border: none !important;
        box-shadow: none !important;
        background-color: #ffffff !important;
        padding: 5px 6px !important;
        margin-bottom: 10px !important;
        border-radius: 14px !important; /* Android 16のトレンドを反映した大きめのラウンド */
        transition: background-color 0.2s cubic-bezier(0.2, 0, 0, 1) !important;
    }

    .android-setting-item:hover {
        background-color: #f1f4f1 !important;
    }

    .android-item-left {
        display: flex !important;
        align-items: center !important;
        gap: 20px !important;
    }

    .android-circle-icon {
        width: 44px !important;
        height: 44px !important;
        border-radius: 50% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        font-weight: 500 !important;
        font-size: 0.95rem !important;
        flex-shrink: 0 !important;
        background-color: #e2e8e3 !important;
    }

    .android-item-text {
        display: flex !important;
        flex-direction: column !important;
        text-align: left !important;
    }

    .android-surah-title {
        font-size: 1.1rem !important;
        font-weight: 500 !important;
        color: var(--android-text-main) !important;
    }

    .android-surah-subtitle {
        font-size: 0.85rem !important;
        color: var(--android-text-sub) !important;
        margin-top: 2px !important;
    }

    .android-save-badge {
        display: inline-flex !important;
        align-items: center !important;
        gap: 4px !important;
        font-size: 0.75rem !important;
        font-weight: 500 !important;
        color: var(--android-selected-text) !important;
        background-color: var(--android-selected-bg) !important;
        padding: 2px 10px !important;
        border-radius: 8px !important;
    }

    .surah-name-ar {
        font-family: 'Amiri', serif !important;
        font-size: 2rem !important;
        color: var(--primary) !important;
        font-weight: normal !important;
        direction: rtl !important;
    }

    #search-modal {
        display: none;
        position: fixed !important; 
        top: 0 !important; left: 0 !important; 
        width: 100% !important; height: 100% !important; 
        background-color: rgba(249, 249, 252, 0.98) !important; 
        z-index: 99999 !important; 
        padding: 140px 24px 24px 24px !important;
        box-sizing: border-box !important;
    }

    .android-search-container {
        background-color: #ffffff !important;
        border-radius: 28px !important; 
        padding: 12px 24px !important;
        max-width: 500px !important;
        margin: 0 auto !important;
        display: flex !important;
        align-items: center !important;
        gap: 16px !important;
        border: 1px solid #dfe3de !important;
    }

    .android-search-container input {
        flex-grow: 1 !important;
        border: none !important;
        outline: none !important;
        background: transparent !important;
        font-size: 1.1rem !important;
        color: var(--android-text-main) !important;
        padding: 4px 0 !important;
        margin: 0 !important;
        height: auto !important;
        box-shadow: none !important;
    }

    .android-search-close-btn {
        background: transparent !important;
        border: none !important;
        color: var(--primary) !important;
        font-size: 1rem !important;
        font-weight: 500 !important;
        padding: 12px 24px !important;
        cursor: pointer !important;
    }

    .btn-download {
        display: inline-flex !important;
        align-items: center !important;
        gap: 8px !important;
        padding: 14px 28px !important;
        background-color: var(--primary) !important;
        color: white !important;
        text-decoration: none !important;
        font-weight: 500 !important;
        border-radius: 24px !important;
    }
</style>
</head>
<body>

<nav class="top m-0">
    <button class="circle transparent" data-ui="#offcanvasMenu">
        <i>menu</i>
    </button>
    <h5 class="max center-align font-bold" onclick="goToIndex()" style="cursor: pointer;">
        AL-くるあーん
    </h5>
    <button class="circle transparent" onclick="openSearchModal()">
        <i>search</i>
    </button>
</nav>


<div id="search-modal" style="display: none;">
    <div class="android-search-container">
        <span class="material-symbols-outlined" style="color: var(--android-text-sub);">search</span>
        <input type="number" id="search-input" placeholder="章番号（1-114）を入力..." min="1" max="114">
    </div>
    <div style="margin-top: 24px; text-align: center;">
        <button onclick="closeSearchModal()" class="android-search-close-btn">閉じる</button>
    </div>
</div>

<main style="margin: 0; padding: 0;">
    <div id="quran-app-container">
        <div id="surah-list-container"></div>
    </div>
</main>

<script src="js/selection.js"></script>

<script>
    function openSearchModal() {
        document.getElementById('search-modal').style.display = 'block';
        document.getElementById('search-input').focus();
    }
    
    function closeSearchModal() {
        document.getElementById('search-modal').style.display = 'none';
    }
    
    function goToIndex() {
        const menu = document.getElementById('offcanvasMenu');
        if (menu && menu.close) menu.close();
        
        if (window.location.search) {
            window.location.href = window.location.pathname;
        } else {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    document.getElementById('search-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const val = parseInt(e.target.value);
            if (val >= 1 && val <= 114) {
                window.location.href = `reader.html?surah=${val}`;
                closeSearchModal();
            } else {
                alert("1から114の数字を入力してください");
            }
        }
    });
</script>

</body>
</html>
