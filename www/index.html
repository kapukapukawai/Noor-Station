<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-くるあーん | 聖典選択</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Noto+Sans+JP:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>

    <style>
        :root {
            --deep-green: #1d4533;
            --variant-orange: #FF8C00;
            --soft-bg: #f8f9f8;
        }

        body { 
            background-color: var(--soft-bg) !important; 
            margin: 0;
            font-family: 'Helvetica Neue', Arial, 'Noto Sans JP', sans-serif;
        }

        /* --- ナビバー --- */
        .main-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: white;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 10px 20px;
        }

        /* --- 章カード（絶対に崩れないモダン版） --- */
        .surah-card {
            background: white !important; 
            padding: 15px 25px !important;
            border: none !important;
            border-bottom: 1px solid #e0e6e3 !important;
            display: flex !important; 
            justify-content: space-between !important; 
            align-items: center !important;
            text-decoration: none !important; 
            color: #333 !important;
            transition: all 0.3s ease;
            overflow: hidden;
            flex-wrap: nowrap !important;
        }

        .surah-card:hover { 
            border-left: 10px solid var(--variant-orange) !important;
            padding-left: 35px !important;
            background-color: #fcfdfc !important;
        }

        .surah-num { 
            font-size: 1.5rem !important;
            font-weight: 200; 
            color: var(--deep-green); 
            opacity: 0.3;
            margin-right: 20px;
            flex-shrink: 0;
        }

        .surah-name-jp { 
            font-size: 1.4rem !important;
            font-weight: 200; 
            color: var(--deep-green);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .surah-meta {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #829b8f;
            margin-top: 2px;
        }

        .surah-name-ar { 
            font-family: 'Amiri', serif !important; 
            font-size: 2rem !important;
            color: var(--deep-green) !important; 
            transition: transform 0.3s ease;
            flex-shrink: 0;
            margin-left: 10px;
            text-align: right;
        }

        .surah-card:hover .surah-name-ar {
            transform: scale(1.1) translateX(-5px);
            color: var(--variant-orange) !important;
        }

        /* --- 保存済みバッジ --- */
        .badge-offline {
            display: inline-flex !important;
            align-items: center;
            gap: 4px;
            background-color: #f0f4f2;
            color: #2c4538;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            border: 1px solid #d1dbd6;
            margin-left: 10px;
            vertical-align: middle;
        }

        /* --- 検索モーダル --- */
        #search-modal {
            display:none; 
            position:fixed; 
            top:0; left:0; 
            width:100%; height:100%; 
            background: rgba(255,255,255,0.98); 
            z-index: 3000; 
            padding: 100px 20px; 
            text-align: center;
        }

        /* --- UIパーツ調整 --- */
        .accordion-button::after {
            margin-left: auto;
        }
        .material-symbols-outlined {
            vertical-align: middle;
        }
    </style>
</head>
<body>

<nav class="main-nav">
    <div style="max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
        <button class="btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" style="border: none; padding: 10px; box-shadow: none;">
            <span class="material-symbols-outlined" style="color: var(--deep-green); font-size: 28px;">menu</span>
        </button>

        <div style="font-weight: 900; letter-spacing: 2px; color: var(--deep-green); font-size: 1.2rem; cursor: pointer;" onclick="goToIndex()">
            AL-くるあーん
        </div>

        <button onclick="openSearchModal()" style="background: none; border: none; cursor: pointer; padding: 10px;">
            <span class="material-symbols-outlined" style="color: var(--deep-green); font-size: 24px;">search</span>
        </button>
    </div>
</nav>

<div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu" style="width: 300px; border-right: none;">
    <div class="offcanvas-header" style="background: var(--deep-green); color: white; padding: 40px 20px;">
        <div style="display: flex; align-items: center; gap: 20px;">
            <div style="width: 60px; height: 60px; background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
                <span class="material-symbols-outlined" style="font-size: 2.5rem; color: var(--deep-green);">menu_book</span>
            </div>
            <div>
                <h5 class="offcanvas-title" style="font-weight: 900; margin: 0;">AL-くるあーん</h5>
                <small style="opacity: 0.7;">Version 2.1B</small>
            </div>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    
    <div class="offcanvas-body" style="padding: 0;">
        <div class="accordion accordion-flush" id="menuAccordion">
            
            <div class="accordion-item">
                <a href="javascript:void(0)" onclick="goToIndex()" class="list-group-item list-group-item-action border-0 p-4 d-flex align-items-center gap-3">
                    <span class="material-symbols-outlined">home</span> ホーム（目録）
                </a>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed p-4 d-flex align-items-center gap-3" type="button" data-bs-toggle="collapse" data-bs-target="#child-qiraat">
                        <span class="material-symbols-outlined">interpreter_mode</span> 読誦変種（10種）
                    </button>
                </h2>
                <div id="child-qiraat" class="accordion-collapse collapse" data-bs-parent="#menuAccordion">
                    <div class="list-group list-group-flush">
                        <a href="#" class="list-group-item list-group-item-action ps-5 py-3 border-0" onclick="changeQiraat('hafs')">Hafs (標準)</a>
                        <a href="#" class="list-group-item list-group-item-action ps-5 py-3 border-0" onclick="changeQiraat('warsh')">Warsh</a>
                        <a href="#" class="list-group-item list-group-item-action ps-5 py-3 border-0" onclick="changeQiraat('khalaf')">Khalaf</a>
                    </div>
                </div>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed p-4 d-flex align-items-center gap-3" type="button" data-bs-toggle="collapse" data-bs-target="#child-settings">
                        <span class="material-symbols-outlined">settings</span> 表示設定
                    </button>
                </h2>
                <div id="child-settings" class="accordion-collapse collapse" data-bs-parent="#menuAccordion">
                    <div class="list-group list-group-flush">
                        <div class="list-group-item ps-5 py-3 border-0 d-flex justify-content-between align-items-center bg-transparent">
                            <div class="d-flex align-items-center gap-2">
                                <span class="material-symbols-outlined" style="color: var(--variant-orange); font-size: 1.2rem;">bolt</span>
                                <span style="font-size: 0.95rem;">自動保存モード</span>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="autoCacheSwitch" style="cursor: pointer; width: 2.5em; height: 1.25em;">
                            </div>
                        </div>
                        <a href="#" class="list-group-item list-group-item-action ps-5 py-3 border-0 bg-transparent" style="font-size: 0.95rem;">
                            <span class="material-symbols-outlined" style="font-size: 1.2rem; vertical-align: middle; margin-right: 8px;">format_size</span>文字サイズ
                        </a>
                        <a href="#" class="list-group-item list-group-item-action ps-5 py-3 border-0 bg-transparent" style="font-size: 0.95rem;">
                            <span class="material-symbols-outlined" style="font-size: 1.2rem; vertical-align: middle; margin-right: 8px;">translate</span>和訳の表示切替
                        </a>
                    </div>
                </div>
            </div>

            <div class="accordion-item">
                <a href="#" class="list-group-item list-group-item-action border-0 p-4 d-flex align-items-center gap-3">
                    <span class="material-symbols-outlined">bookmarks</span> ブックマーク（近日公開）
                </a>
            </div>

            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed p-4 d-flex align-items-center gap-3" type="button" data-bs-toggle="collapse" data-bs-target="#child-download">
                        <span class="material-symbols-outlined">download_for_offline</span> ダウンロードオプション
                    </button>
                </h2>
                <div id="child-download" class="accordion-collapse collapse" data-bs-parent="#menuAccordion">
                    <div class="list-group list-group-flush">
                        <a href="setting/surainport.html?mode=text" class="list-group-item list-group-item-action ps-5 py-3 border-0">📖 聖典本文管理</a>
                        <a href="setting/surainport.html?mode=ja" class="list-group-item list-group-item-action ps-5 py-3 border-0">🇯🇵 和訳管理</a>
                        <a href="setting/surainport.html?mode=wbw" class="list-group-item list-group-item-action ps-5 py-3 border-0">🧩 単語訳管理</a>
                        <a href="setting/surainport.html?mode=audio" class="list-group-item list-group-item-action ps-5 py-3 border-0">🔊 音声管理</a>
                    </div>
                </div>
            </div>
            <div style="text-align: center; margin: 40px 0;">
    <h6>Android版アプリを直接ダウンロード</h6>
    <p>下のボタンをタップして、アプリのインストールファイルをダウンロードできます。</p>

    <a href="App.zip" download="NextQuran.zip" class="btn-download">

</div>

<style>
/* ボタンを押しやすくするシンプルなデザイン */
.btn-download {
    display: inline-block;
    padding: 15px 30px;
    background-color: #198754; /* クルアーンアプリ風のグリーン */

    text-decoration: none;
    font-size: 1.2rem;
    font-weight: bold;

    color: white;

        </div>
    </div>
</div>

<div id="search-modal">
    <input type="text" id="search-input" placeholder="章番号（1-114）を入力..." 
           style="width: 100%; max-width: 600px; border: none; border-bottom: 2px solid var(--deep-green); font-size: 2rem; padding: 10px; outline: none; background: transparent; text-align: center;">
    <div style="margin-top: 20px;">
        <button onclick="closeSearchModal()" class="btn btn-outline-secondary rounded-pill px-4">閉じる</button>
    </div>
</div>

<div id="quran-app-container">
    <div id="surah-list-container"></div>
</div>

<script src="js/selection.js"></script>

<script>
    // ナビゲーション処理
    function openSearchModal() {
        document.getElementById('search-modal').style.display = 'block';
        document.getElementById('search-input').focus();
    }
    
    function closeSearchModal() {
        document.getElementById('search-modal').style.display = 'none';
    }
    
    function goToIndex() {
        const menu = document.getElementById('offcanvasMenu');
        const bsOffcanvas = bootstrap.Offcanvas.getInstance(menu);
        if (bsOffcanvas) bsOffcanvas.hide();
        
        if (window.location.search) {
            window.location.href = window.location.pathname;
        } else {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    // 検索入力イベント
    document.getElementById('search-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const val = parseInt(e.target.value);
            if (val >= 1 && val <= 114) {
                window.location.href = `reader.html?surah=${val}`;
                closeSearchModal();
            } else {
                alert("1から114の数字を入力してください");
            }
        }
    });
</script>

</body>
</html>
